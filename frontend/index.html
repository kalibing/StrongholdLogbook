<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="卫戍协议的个人对局档案、战报与数据统计">
    <title>卫戍协议 · 作战档案</title>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('logbook:theme') === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <style>
      /* 首屏关键样式：避免样式表加载前的白闪与布局跳动 */
      html { background: #0a0e0c; color-scheme: dark; scrollbar-gutter: stable; }
      html[data-theme="light"] { background: #edf1ee; color-scheme: light; }
      body { margin: 0; background: transparent; color: #eef3ef; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
      html[data-theme="light"] body { color: #131a16; }
      #app { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
