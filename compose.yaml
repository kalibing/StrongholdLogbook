# Linux 服务器部署：cp .env.example .env（或 scripts/init-env.sh 生成）后 docker compose up -d --build
#
# 网络划分：
#   data  内部网络（internal: true，没有出网能力）：db / migrate / api / worker
#   edge  对外网络：web（Caddy）与 api；api 需要经它访问森空岛、鹰角与 AI 接口
# 只有 web 向宿主机发布端口；数据库和 API 都不能从宿主机外直接访问。

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: logbook
      POSTGRES_DB: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [data]
    security_opt:
      - no-new-privileges:true
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  migrate:
    <<: *hardening
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &database
      POSTGRES_HOST: db
      POSTGRES_USER: logbook
      POSTGRES_DB: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    networks: [data]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hardening
    build: ./backend
    environment:
      <<: *database
      LOGBOOK_CREDENTIAL_KEY: ${LOGBOOK_CREDENTIAL_KEY:?Set LOGBOOK_CREDENTIAL_KEY in .env}
      LOGBOOK_AI_ENDPOINT: ${LOGBOOK_AI_ENDPOINT:-}
      LOGBOOK_AI_MODEL: ${LOGBOOK_AI_MODEL:-}
      LOGBOOK_AI_API_KEY: ${LOGBOOK_AI_API_KEY:-}
    networks: [data, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    <<: *hardening
    build: ./backend
    command: ["python", "-m", "logbook.worker"]
    environment: *database
    networks: [data]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HOST_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
      - "${HOST_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # 本机助手 exe：放进宿主机 deploy/download/ 即可下载，无需重建镜像
      - ./deploy/download:/srv/download:ro
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  data:
    internal: true
  edge:

volumes:
  postgres:
  caddy_data:
  caddy_config:
