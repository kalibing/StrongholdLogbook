services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: logbook
      POSTGRES_DB: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logbook -d logbook"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &database
      POSTGRES_HOST: db
      POSTGRES_USER: logbook
      POSTGRES_DB: logbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      <<: *database
      LOGBOOK_CREDENTIAL_KEY: ${LOGBOOK_CREDENTIAL_KEY:?Set LOGBOOK_CREDENTIAL_KEY in .env}
      LOGBOOK_AI_ENDPOINT: ${LOGBOOK_AI_ENDPOINT:-}
      LOGBOOK_AI_MODEL: ${LOGBOOK_AI_MODEL:-}
      LOGBOOK_AI_API_KEY: ${LOGBOOK_AI_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["python", "-m", "logbook.worker"]
    environment: *database
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${HOST_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  caddy_data:
  caddy_config:
