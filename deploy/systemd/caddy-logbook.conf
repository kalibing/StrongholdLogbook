# 裸机部署时 Caddy（发行版的 caddy 包）的 systemd 覆盖配置，让 deploy/Caddyfile 指向本机服务：
#   sudo mkdir -p /etc/systemd/system/caddy.service.d
#   sudo cp deploy/systemd/caddy-logbook.conf /etc/systemd/system/caddy.service.d/logbook.conf
#   sudo cp deploy/Caddyfile /etc/caddy/Caddyfile
#   sudo systemctl daemon-reload && sudo systemctl restart caddy
[Service]
Environment=SITE_ADDRESS=logbook.example.com
Environment=API_UPSTREAM=127.0.0.1:8000
Environment=SITE_ROOT=/var/www/logbook
Environment=QQBOT_UPSTREAM=127.0.0.1:8001
