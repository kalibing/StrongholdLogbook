# 宝塔面板（Nginx）站点的扩展配置：放到
#   /www/server/panel/vhost/nginx/extension/<站点域名>/logbook.conf
# 站点主配置会 include 这个目录，不用改宝塔生成的主配置。修改后先 nginx -t 再 nginx -s reload。
#
# 前端构建产物放在站点根目录（FTP 目录）；后端在 /opt/logbook，只监听 127.0.0.1，由这里反代。
# 安全响应头与 deploy/Caddyfile 保持一致。location 里一旦写了 add_header，就不再继承 server 级的头，
# 所以 HSTS 在每个 location 里重复写。

# ---- API ----
location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # 覆盖而不是追加：客户端自带的 X-Forwarded-For 无法伪造来源 IP（登录 / 注册限速依赖它）
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 10m;
    proxy_read_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# ---- QQ 机器人回调：只开放这一个路径 ----
location = /qqbot/webhook {
    proxy_pass http://127.0.0.1:8001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}
location ^~ /qqbot/ {
    return 404;
}

# ---- 本机助手下载：文件不存在时 404，不回退到 index.html ----
location ^~ /download/ {
    try_files $uri =404;
    add_header Content-Disposition attachment always;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# ---- 带哈希的静态资源：长缓存 ----
location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
}

# ---- 单页应用：前端路由回退到 index.html ----
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://web.hycdn.cn; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
}
